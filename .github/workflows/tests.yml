name: tests

# Validate the committed repository snapshot. Gate D measured evidence is
# persisted on main before this workflow is expected to certify the snapshot.
on:
  push:
    branches: [main]
    tags: ["submission-v1.0"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Verify data SHA-256
        run: sha256sum data/sample/*

      - name: Run submission validator
        env:
          PYTHONPATH: src
        run: python scripts/validate_submission.py .

      - name: Validate final submission tag
        if: github.ref == 'refs/tags/submission-v1.0'
        env:
          PYTHONPATH: src
        run: python scripts/validate_submission.py . --require-tag
